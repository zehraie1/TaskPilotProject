<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <text x="700" y="62" text-anchor="middle" font-size="38" font-weight="800" fill="#fff">TestPilot PW</text>
  <text x="700" y="96" text-anchor="middle" font-size="18" fill="#c7d2fe">AI-assisted Playwright automation lifecycle for the TaskPilot app</text>

  <!-- Row 1: lifecycle -->
  <g filter="url(#sh)" font-size="15" text-anchor="middle">
    <g transform="translate(40,140)"><rect width="190" height="150" rx="18" fill="#2563eb"/><text x="95" y="48" font-size="34">📋</text><text x="95" y="86" fill="#fff" font-weight="700" font-size="18">1 · Jira Story</text><text x="95" y="112" fill="#dbeafe">TP-101 … TP-106</text><text x="95" y="132" fill="#dbeafe">fixture / connected</text></g>
    <g transform="translate(265,140)"><rect width="190" height="150" rx="18" fill="#7c3aed"/><text x="95" y="48" font-size="34">🔍</text><text x="95" y="86" fill="#fff" font-weight="700" font-size="18">2 · Analyze</text><text x="95" y="112" fill="#ede9fe">missing &amp; ambiguous</text><text x="95" y="132" fill="#ede9fe">requirements</text></g>
    <g transform="translate(490,140)"><rect width="190" height="150" rx="18" fill="#db2777"/><text x="95" y="48" font-size="34">🧪</text><text x="95" y="86" fill="#fff" font-weight="700" font-size="18">3 · Test Cases</text><text x="95" y="112" fill="#fce7f3">positive · negative</text><text x="95" y="132" fill="#fce7f3">boundary · reviewed</text></g>
    <g transform="translate(715,140)"><rect width="190" height="150" rx="18" fill="#ea580c"/><text x="95" y="48" font-size="34">🎭</text><text x="95" y="86" fill="#fff" font-weight="700" font-size="18">4 · Automate</text><text x="95" y="112" fill="#ffedd5">UI · API · Hybrid</text><text x="95" y="132" fill="#ffedd5">POM + Codegen</text></g>
    <g transform="translate(940,140)"><rect width="190" height="150" rx="18" fill="#16a34a"/><text x="95" y="48" font-size="34">✅</text><text x="95" y="86" fill="#fff" font-weight="700" font-size="18">5 · Assert</text><text x="95" y="112" fill="#dcfce7">verifyAC steps</text><text x="95" y="132" fill="#dcfce7">expected vs actual</text></g>
    <g transform="translate(1165,140)"><rect width="190" height="150" rx="18" fill="#0891b2"/><text x="95" y="48" font-size="34">📊</text><text x="95" y="86" fill="#fff" font-weight="700" font-size="18">6 · Report</text><text x="95" y="112" fill="#cffafe">HTML · AC matrix</text><text x="95" y="132" fill="#cffafe">Jira · GitHub CI</text></g>
  </g>
  <g stroke="#cbd5e1" stroke-width="3" marker-end="url(#arr)">
    <line x1="232" y1="215" x2="262" y2="215"/><line x1="457" y1="215" x2="487" y2="215"/><line x1="682" y1="215" x2="712" y2="215"/><line x1="907" y1="215" x2="937" y2="215"/><line x1="1132" y1="215" x2="1162" y2="215"/>
  </g>

  <!-- Row 2: three test layers -->
  <text x="700" y="345" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">One Playwright Test runner · three test layers</text>
  <g filter="url(#sh)">
    <g transform="translate(60,370)"><rect width="400" height="200" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
      <text x="24" y="44" font-size="22" font-weight="800" fill="#fbbf24">🖥️ UI tests</text>
      <text x="24" y="80" font-size="16" fill="#e2e8f0">Page Objects: Dashboard · Tasks · Form · Details</text>
      <text x="24" y="108" font-size="16" fill="#e2e8f0">getByRole → getByLabel → getByTestId</text>
      <text x="24" y="136" font-size="16" fill="#e2e8f0">Loading &amp; error states via page.route()</text>
      <text x="24" y="164" font-size="16" fill="#e2e8f0">No sleeps · web-first assertions</text></g>
    <g transform="translate(500,370)"><rect width="400" height="200" rx="18" fill="#1e293b" stroke="#22d3ee" stroke-width="3"/>
      <text x="24" y="44" font-size="22" font-weight="800" fill="#67e8f9">🔌 API tests</text>
      <text x="24" y="80" font-size="16" fill="#e2e8f0">APIRequestContext · TaskApiClient</text>
      <text x="24" y="108" font-size="16" fill="#e2e8f0">status → Ajv schema → values → persistence</text>
      <text x="24" y="136" font-size="16" fill="#e2e8f0">Boundaries: 1/120/121 · 2000/2001 · 0/1/100/101</text>
      <text x="24" y="164" font-size="16" fill="#e2e8f0">404 not_found · 422 validation_error</text></g>
    <g transform="translate(940,370)"><rect width="400" height="200" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
      <text x="24" y="44" font-size="22" font-weight="800" fill="#c4b5fd">🔀 Hybrid tests</text>
      <text x="24" y="80" font-size="16" fill="#e2e8f0">A API create → UI · B UI create → API</text>
      <text x="24" y="108" font-size="16" fill="#e2e8f0">C API update → UI · D UI complete → API</text>
      <text x="24" y="136" font-size="16" fill="#e2e8f0">E delete → gone everywhere (404)</text>
      <text x="24" y="164" font-size="16" fill="#e2e8f0">Act in one channel, verify in the other</text></g>
  </g>

  <!-- Row 3: golden rules -->
  <g transform="translate(60,610)" filter="url(#sh)"><rect width="1280" height="170" rx="18" fill="#f8fafc"/>
    <text x="30" y="42" font-size="22" font-weight="800" fill="#0f172a">⭐ Golden rules</text>
    <g font-size="16" fill="#1e293b">
      <text x="30" y="80">🧬 Unique data per test: TPW-&lt;runId&gt;-…  + guaranteed cleanup</text>
      <text x="30" y="110">🏷️ A Jira tag is NOT coverage — executed AC assertions are</text>
      <text x="30" y="140">🎥 Evidence: screenshot + video on failure, trace on retry</text>
      <text x="680" y="80">🚫 Never invent endpoints, selectors or results</text>
      <text x="680" y="110">🔐 Secrets only in .env / GitHub Secrets — sanitized evidence</text>
      <text x="680" y="140">✋ Jira publishing: dry run by default, explicit approval to post</text>
    </g>
  </g>
</svg>
